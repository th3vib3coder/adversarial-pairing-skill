name: CI

'on':
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        node:
          - '18.17.0'
          - '24'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '${{ matrix.node }}'
          package-manager-cache: 'false'

      - name: Expose Git Bash on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $gitBash = 'C:\Program Files\Git\bin\bash.exe'
          if (-not (Test-Path -LiteralPath $gitBash -PathType Leaf)) {
            throw "Git Bash was not found at $gitBash"
          }
          Split-Path -Parent $gitBash |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Run test suite
        shell: bash
        run: node --test

      - name: Validate wiki schema
        shell: bash
        run: node wiki/tools/wiki-lint.mjs wiki --json

      - name: Check registry stub drift
        shell: bash
        run: node wiki/tools/build-registries.mjs . --check

      - name: Check governance tool syntax
        shell: bash
        run: |
          node --check wiki/tools/audit-entity-exports.mjs
          node --check wiki/tools/build-registries.mjs
          node --check wiki/tools/sync-mirror.mjs
          node --check wiki/tools/wiki-lint.mjs

      - name: Require a clean checkout
        shell: bash
        run: |
          git diff --exit-code
          status="$(git status --porcelain=v1 --untracked-files=all)"
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status"
            exit 1
          fi
